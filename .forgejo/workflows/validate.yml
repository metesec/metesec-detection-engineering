name: Repository validation

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  validate:
    name: Contracts, detections, catalogue, and Sentinel preview
    runs-on: metesec-detection-validate
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify runner toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(python --version)" = "Python 3.12.13"

      - name: Install pnpm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" pnpm@11.19.0
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"

      - name: Create Python environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Sigma toolchain
        run: python -m pip install --requirement requirements-sigma.lock

      - name: Run complete repository validation
        run: pnpm run check

      - name: Build reproducible release candidate
        run: pnpm run build:release
