name: Repository validation

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  validate:
    name: Contracts, detections, catalogue, and Sentinel preview
    runs-on: docker
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Set up Python
        uses: https://data.forgejo.org/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Sigma toolchain
        run: python -m pip install --requirement requirements-sigma.lock

      - name: Run complete repository validation
        run: pnpm run check
