title: Remote Windows service creation command through SC
id: 3e944022-ded8-48d7-8456-b7166a01c894
status: experimental
description: Detects SC commands requesting service creation on an explicit remote UNC host. Process creation does not establish that the remote operation succeeded.
references:
  - https://attack.mitre.org/techniques/T1543/003/
  - https://learn.microsoft.com/en-us/windows/win32/services/configuring-a-service-using-sc
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
author: MeteSec Detection Engineering
license: Apache-2.0
date: 2026-09-03
modified: 2026-09-11
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName: sc.exe
  selection_original:
    ProcessVersionInfoOriginalFileName: sc.exe
  selection_remote_create:
    ProcessCommandLine|re|i: '^\s*(?:"[^"]+"|\S+)\s+"?\\\\[^\\\s"]+"?\s+create\s+\S+'
  condition: (selection_image or selection_original) and selection_remote_create
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - ProcessVersionInfoOriginalFileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved remote software deployment, support, or service administration through SC.
level: medium
