title: Remote scheduled task creation command
id: 0b7dc650-bd67-451e-b006-c27a85bffe8d
status: experimental
description: Detects a Schtasks command requesting task creation with an explicit /s target. Process telemetry does not establish that the task was created successfully.
references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/SigmaHQ/sigma/tree/master/rules/windows/process_creation
author: MeteSec Detection Engineering
license: Apache-2.0
date: 2026-09-03
modified: 2026-09-11
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName: schtasks.exe
  selection_original:
    ProcessVersionInfoOriginalFileName: schtasks.exe
  selection_create:
    ProcessCommandLine|re|i: '(?:^|\s)/create(?:\s|$)'
  selection_remote:
    ProcessCommandLine|re|i: '^\s*(?:"[^"]*"|[^\s"]+)(?:\s+(?:"[^"]*"|[^\s"]+))*\s+/s\s+(?:"[^"]+"|[^\s"]+)'
  condition: (selection_image or selection_original) and selection_create and selection_remote
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - ProcessVersionInfoOriginalFileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved remote administration, software deployment, and maintenance workflows.
level: medium
