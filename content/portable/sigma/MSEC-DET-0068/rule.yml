# bounded predicates and repository-local synthetic evidence replace normalization.
title: "Credential Guard registry configuration explicitly zeroed"
id: "1a8c07e1-f7d2-51e1-acce-26e8eb4d3653"
status: "experimental"
description: "Detects LsaCfgFlags set to a decimal or hexadecimal zero at its machine registry configuration location."
references:
  - "https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/configure"
  - "https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/"
  - "https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceregistryevents-table"
  - "https://attack.mitre.org/techniques/T1685/"
author: "MeteSec (AI-assisted implementation; human review pending)"
date: "2026-09-11"
modified: 2026-09-11
license: "Apache-2.0"
tags:
  - "attack.defense-impairment"
  - "attack.t1685"
logsource:
  product: "windows"
  category: "registry_event"
detection:
  key:
    RegistryKey|re: "(?i)^HKEY_LOCAL_MACHINE\\\\(?:SYSTEM\\\\(?:CurrentControlSet|ControlSet[0-9]{3})\\\\Control\\\\Lsa|SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\DeviceGuard)$"
    RegistryValueName: "LsaCfgFlags"
  zero:
    ActionType: "RegistryValueSet"
    RegistryValueData|re: "(?i)^(?:0+|0x0+)$"
  condition: "key and zero"
fields:
  - "TimeGenerated"
  - "Timestamp"
  - "DeviceId"
  - "DeviceName"
  - "ActionType"
  - "InitiatingProcessAccountDomain"
  - "InitiatingProcessAccountName"
  - "InitiatingProcessAccountSid"
  - "InitiatingProcessFileName"
  - "InitiatingProcessCommandLine"
  - "RegistryKey"
  - "RegistryValueName"
  - "RegistryValueData"
  - "ReportId"
falsepositives:
  - "Approved security-policy rollback, compatibility troubleshooting or repeated application of an already-disabled configuration."
level: "medium"
