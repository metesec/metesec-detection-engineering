title: "Print port monitor DLL registered from a staging or remote path"
id: "8f003272-070b-507a-9ef6-10ad9ed027ea"
status: "experimental"
description: "Detects a machine registry DLL registration whose complete value names a DLL in selected profile, temporary, environment-variable or UNC locations."
references:
  - "https://attack.mitre.org/techniques/T1547/010/"
  - "https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceregistryevents-table"
  - "https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/registry/registry_set/registry_set_add_port_monitor.yml"
author: "MeteSec (AI-assisted implementation; human review pending)"
date: "2026-09-11"
modified: 2026-09-11
license: "Apache-2.0"
tags:
  - "attack.persistence"
  - "attack.t1547.010"
logsource:
  product: "windows"
  category: "registry_event"
detection:
  selection:
    ActionType: "RegistryValueSet"
    RegistryKey|re: "(?i)^HKEY_LOCAL_MACHINE\\\\SYSTEM\\\\(?:CurrentControlSet|ControlSet[0-9]{3})\\\\Control\\\\Print\\\\Monitors\\\\[^\\\\]+$"
    RegistryValueData|re: "(?i)^(?:\"(?:[a-z]:\\\\(?:users\\\\|windows\\\\temp\\\\|temp\\\\|perflogs\\\\|\\$recycle\\.bin\\\\)|%(?:temp|tmp|appdata|localappdata|userprofile)%\\\\|\\\\\\\\[a-z0-9_-][^\\\\/:*?\"<>|\\r\\n]*\\\\[^\\\\/:*?\"<>|\\r\\n]+\\\\)[^\"\\r\\n]*\\.dll\"|(?:[a-z]:\\\\(?:users\\\\|windows\\\\temp\\\\|temp\\\\|perflogs\\\\|\\$recycle\\.bin\\\\)|%(?:temp|tmp|appdata|localappdata|userprofile)%\\\\|\\\\\\\\[a-z0-9_-][^\\\\/:*?\"<>|\\r\\n]*\\\\[^\\\\/:*?\"<>|\\r\\n]+\\\\)[^\"\\r\\n]*\\.dll)$"
    RegistryValueName: "Driver"
  condition: "selection"
fields:
  - "TimeGenerated"
  - "Timestamp"
  - "DeviceId"
  - "DeviceName"
  - "ActionType"
  - "InitiatingProcessAccountDomain"
  - "InitiatingProcessAccountName"
  - "InitiatingProcessAccountSid"
  - "InitiatingProcessFileName"
  - "InitiatingProcessCommandLine"
  - "RegistryKey"
  - "RegistryValueName"
  - "RegistryValueData"
  - "ReportId"
falsepositives:
  - "Approved print-management products or controlled testing registering a port monitor from a nonstandard path."
level: "high"
related:
  -
    id: "944e8941-f6f6-4ee8-ac05-1c224e923c0e"
    type: "similar"
