title: Mavinject Process Injection Command
id: dd719ce8-90d6-4dd3-ab2c-b3a8ae04841a
status: experimental
description: Detects Mavinject or a renamed Mavinject binary using the INJECTRUNNING or HMODULE injection switches.
references:
  - https://attack.mitre.org/techniques/T1218/013/
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.stealth
  - attack.t1218.013
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName:
      - mavinject.exe
      - mavinject64.exe
  selection_original:
    ProcessVersionInfoOriginalFileName:
      - mavinject.exe
      - mavinject64.exe
  selection_switch:
    ProcessCommandLine|contains:
      - '/INJECTRUNNING'
      - '/HMODULE'
  condition: (selection_image or selection_original) and selection_switch
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - ProcessVersionInfoOriginalFileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Legitimate Microsoft App-V activity or explicitly authorized security testing that invokes Mavinject injection functionality.
level: high
