title: Mavinject process injection command
id: dd719ce8-90d6-4dd3-ab2c-b3a8ae04841a
status: experimental
description: Detects Mavinject commands carrying a bounded INJECTRUNNING or HMODULE switch, including renamed executables identified by original-filename metadata. Successful injection and trustworthy binary identity require separate validation.
references:
  - https://attack.mitre.org/techniques/T1218/013/
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
author: MeteSec Detection Engineering
license: Apache-2.0
date: 2026-09-03
modified: 2026-09-11
tags:
  - attack.stealth
  - attack.t1218.013
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName:
      - mavinject.exe
      - mavinject64.exe
  selection_original:
    ProcessVersionInfoOriginalFileName:
      - mavinject.exe
      - mavinject64.exe
  selection_switch:
    ProcessCommandLine|re|i: '(?:^|\s)/(?:INJECTRUNNING(?:\s|$)|HMODULE(?:=|\s))'
  condition: (selection_image or selection_original) and selection_switch
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - ProcessVersionInfoOriginalFileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Legitimate Microsoft App-V activity or explicitly authorized security testing that invokes Mavinject injection functionality.
level: high
