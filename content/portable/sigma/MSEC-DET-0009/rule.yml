title: Security Information Registered for a Microsoft Entra Account
id: a2e33c48-a5e6-4853-b2a1-8c18566b52b8
status: experimental
description: Detects successful administrator or user registration of security information for a Microsoft Entra account.
references:
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/auditlogs
  - https://attack.mitre.org/techniques/T1098/001/
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName:
      - Admin registered security info
      - User registered security info
    Result: success
  condition: selection
fields:
  - TimeGenerated
  - OperationName
  - Result
  - InitiatedBy
  - TargetResources
  - CorrelationId
  - LoggedByService
falsepositives:
  - Normal MFA enrollment, device replacement, account recovery, help-desk support, and approved identity lifecycle activity.
level: medium
