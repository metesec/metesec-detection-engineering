title: InstallUtil References a Remote Payload
id: 24987f96-7eaa-49b5-a8ce-c3b6a47e0dfb
status: experimental
description: Detects InstallUtil execution that references content over HTTP, HTTPS, or FTP.
references:
  - https://attack.mitre.org/techniques/T1218/004/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_installutil_download.yml
  - https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/applications-that-can-bypass-appcontrol
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.stealth
  - attack.command-and-control
  - attack.t1218.004
  - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName: InstallUtil.exe
  selection_original:
    ProcessVersionInfoOriginalFileName: InstallUtil.exe
  selection_protocol:
    ProcessCommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
  condition: (selection_image or selection_original) and selection_protocol
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - ProcessVersionInfoOriginalFileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved .NET build, test, or deployment workflows that intentionally pass a remote assembly or installer resource to InstallUtil.
level: medium
