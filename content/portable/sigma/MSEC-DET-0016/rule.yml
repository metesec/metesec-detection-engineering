title: Native Windows Utility Attempts to Inhibit System Recovery
id: cc787796-dd74-42d2-88e8-1ccece9d4fad
status: experimental
description: Detects selected native Windows utilities attempting to delete recovery data or weaken recovery settings. Process telemetry does not prove that the action succeeded.
references:
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-find-ransomware
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
  - https://attack.mitre.org/techniques/T1490/
author: MeteSec Detection Engineering
license: Apache-2.0
date: 2026-09-03
modified: 2026-09-11
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  image_vssadmin:
    FileName: vssadmin.exe
  command_delete_shadows:
    ProcessCommandLine|re: '(?i)\sdelete\s+shadows(?:\s|$)'
  image_wmic:
    FileName: wmic.exe
  command_shadowcopy:
    ProcessCommandLine|re: '(?i)\sshadowcopy(?:\s+[^\r\n]*)?\sdelete(?:\s|$)'
  image_wbadmin:
    FileName: wbadmin.exe
  command_catalog:
    ProcessCommandLine|re: '(?i)\sdelete\s+(?:catalog|systemstatebackup)(?:\s|$)'
  image_bcdedit:
    FileName: bcdedit.exe
  command_recoveryenabled:
    ProcessCommandLine|re: '(?i)\s/set\s+(?:\{[^}]+\}\s+)?recoveryenabled\s+(?:no|off|0)(?:\s|$)'
  command_bootstatuspolicy:
    ProcessCommandLine|re: '(?i)\s/set\s+(?:\{[^}]+\}\s+)?bootstatuspolicy\s+ignoreallfailures(?:\s|$)'
  image_reagentc:
    FileName: reagentc.exe
  command_disable:
    ProcessCommandLine|re: '(?i)\s/disable(?:\s|$)'
  condition: (image_vssadmin and command_delete_shadows) or (image_wmic and command_shadowcopy) or (image_wbadmin and command_catalog) or (image_bcdedit and (command_recoveryenabled or command_bootstatuspolicy)) or (image_reagentc and command_disable)
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved backup retirement, disaster-recovery testing, system imaging, and operating-system maintenance.
level: high
