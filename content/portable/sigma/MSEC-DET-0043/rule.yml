title: Msiexec Installs a Remote Web Package
id: b9fe36d2-0886-4e23-ba77-c5a28624b8e4
status: experimental
description: Detects Msiexec execution that references an MSI package over HTTP or HTTPS.
references:
  - https://attack.mitre.org/techniques/T1218/007/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_msiexec_web_install.yml
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.stealth
  - attack.command-and-control
  - attack.t1218.007
  - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName: msiexec.exe
  selection_original:
    ProcessVersionInfoOriginalFileName: msiexec.exe
  selection_protocol:
    ProcessCommandLine|contains:
      - 'http://'
      - 'https://'
  selection_package:
    ProcessCommandLine|contains: '.msi'
  condition: (selection_image or selection_original) and selection_protocol and selection_package
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - ProcessVersionInfoOriginalFileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved software deployment or repair workflows that install signed MSI packages from managed HTTP or HTTPS repositories.
level: medium
