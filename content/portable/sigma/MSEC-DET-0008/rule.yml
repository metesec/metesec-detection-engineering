title: Permanent Microsoft Entra Role Assignment Outside PIM
id: 084d04ac-4282-4454-b605-a9ac5c50763f
status: experimental
description: Detects a successful permanent Microsoft Entra role assignment made outside Privileged Identity Management.
references:
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/auditlogs
  - https://attack.mitre.org/techniques/T1098/003/
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName: Add member to role outside of PIM (permanent)
    Result: success
  condition: selection
fields:
  - TimeGenerated
  - OperationName
  - Result
  - InitiatedBy
  - TargetResources
  - CorrelationId
  - LoggedByService
falsepositives:
  - Approved emergency-access accounts, migrations, break-glass procedures, and administrative changes.
level: high
