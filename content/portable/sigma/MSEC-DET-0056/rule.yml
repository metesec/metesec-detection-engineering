# Adapted from MeteSec Hardened 23 (Apache-2.0): raw source fields,
# bounded predicates and repository-local synthetic evidence replace normalization.
title: "LSASS loads a DLL from a staging or remote location"
id: "0a9bdcc8-ae9c-478d-9f4c-cbc01c7cc0f4"
status: "experimental"
description: "Detects an ImageLoaded event for a DLL initiated by lsass.exe from a rooted profile, temporary, recycle-bin or UNC location."
references:
  - "https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceimageloadevents-table"
  - "https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/deviceimageloadevents"
  - "https://attack.mitre.org/techniques/T1547/005/"
  - "https://attack.mitre.org/techniques/T1055/001/"
author: "MeteSec (AI-assisted implementation; human review pending)"
date: "2026-09-11"
modified: 2026-09-11
license: "Apache-2.0"
tags:
  - "attack.persistence"
  - "attack.t1547.005"
logsource:
  product: "windows"
  category: "image_load"
detection:
  selection:
    ActionType: "ImageLoaded"
    InitiatingProcessFileName: "lsass.exe"
    FileName|endswith: ".dll"
    FolderPath|re: "(?i)^(?:[a-z]:\\\\(?:users|windows\\\\temp|temp|perflogs|\\$recycle\\.bin)(?:\\\\|$)|\\\\\\\\[a-z0-9_-][^\\\\/:*?\"<>|\\r\\n]*\\\\[^\\\\/:*?\"<>|\\r\\n]+(?:\\\\|$))"
  condition: "selection"
fields:
  - "TimeGenerated"
  - "DeviceId"
  - "DeviceName"
  - "ActionType"
  - "FileName"
  - "FolderPath"
  - "SHA1"
  - "InitiatingProcessAccountName"
  - "InitiatingProcessFileName"
  - "InitiatingProcessFolderPath"
  - "InitiatingProcessCommandLine"
  - "ReportId"
falsepositives:
  - "Approved authentication or security-provider software loading a DLL from an unusual profile or staging directory."
level: "high"
