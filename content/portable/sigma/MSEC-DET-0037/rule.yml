title: Fodhelper Spawns a Suspicious Child Process
id: cb9040a8-6ce6-410c-91e7-90eb133626f1
status: experimental
description: Detects fodhelper.exe spawning a command interpreter or administrative utility associated with UAC bypass activity.
references:
  - https://attack.mitre.org/techniques/T1548/002/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_fodhelper.yml
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.privilege-escalation
  - attack.defense-evasion
  - attack.t1548.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    InitiatingProcessFileName: fodhelper.exe
  selection_child:
    FileName:
      - cmd.exe
      - powershell.exe
      - pwsh.exe
      - mshta.exe
      - rundll32.exe
      - wscript.exe
      - cscript.exe
      - reg.exe
  condition: selection_parent and selection_child
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved administrative automation or security testing that intentionally launches a selected child through Fodhelper.
level: high
