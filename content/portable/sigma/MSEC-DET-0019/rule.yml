title: Microsoft Entra Federation Trust Configuration Changed
id: 920c3352-0d65-4444-8aa4-6d08d485ed2e
status: experimental
description: Detects a successful Microsoft Entra audit operation that changes domain federation settings or domain authentication configuration.
references:
  - https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-monitor-federation-changes
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/auditlogs
  - https://attack.mitre.org/techniques/T1484/002/
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.privilege-escalation
  - attack.defense-impairment
  - attack.t1484.002
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName:
      - Set federation settings on domain
      - Set domain authentication
    Result: success
  condition: selection
fields:
  - TimeGenerated
  - OperationName
  - Result
  - InitiatedBy
  - TargetResources
  - CorrelationId
  - LoggedByService
falsepositives:
  - Approved federation migration, certificate rotation, domain conversion, and identity-platform maintenance.
level: high
