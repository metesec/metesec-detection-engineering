# Adapted from MeteSec Hardened 23 (Apache-2.0): raw source fields,
# bounded predicates and repository-local synthetic evidence replace normalization.
title: "System-named process connects publicly from a staging or remote location"
id: "9d18453a-b8fc-4935-99c4-699fab55aa6a"
status: "experimental"
description: "Detects a successful public-IP connection by a selected Windows system-process name whose executable resides in a rooted profile, temporary, recycle-bin or UNC location."
references:
  - "https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicenetworkevents-table"
  - "https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/devicenetworkevents"
  - "https://attack.mitre.org/techniques/T1036/005/"
author: "MeteSec (AI-assisted implementation; human review pending)"
date: "2026-09-11"
modified: 2026-09-11
license: "Apache-2.0"
tags:
  - "attack.defense-evasion"
  - "attack.t1036.005"
logsource:
  product: "windows"
  category: "network_connection"
detection:
  selection:
    ActionType: "ConnectionSuccess"
    RemoteIPType: "Public"
    InitiatingProcessFileName:
      - "svchost.exe"
      - "services.exe"
      - "lsass.exe"
      - "winlogon.exe"
      - "csrss.exe"
      - "smss.exe"
      - "spoolsv.exe"
      - "taskhostw.exe"
      - "dllhost.exe"
      - "conhost.exe"
    InitiatingProcessFolderPath|re: "(?i)^(?:[a-z]:\\\\(?:users|windows\\\\temp|temp|perflogs|\\$recycle\\.bin)(?:\\\\|$)|\\\\\\\\[a-z0-9_-][^\\\\/:*?\"<>|\\r\\n]*\\\\[^\\\\/:*?\"<>|\\r\\n]+(?:\\\\|$))"
  condition: "selection"
fields:
  - "TimeGenerated"
  - "DeviceId"
  - "DeviceName"
  - "ActionType"
  - "RemoteIP"
  - "RemoteIPType"
  - "RemotePort"
  - "InitiatingProcessAccountName"
  - "InitiatingProcessFileName"
  - "InitiatingProcessFolderPath"
  - "InitiatingProcessCommandLine"
  - "ReportId"
falsepositives:
  - "Approved software deliberately using a system-like executable name in a selected staging path, or controlled security testing."
level: "high"
