title: PowerShell Attempts to Weaken Microsoft Defender Antivirus
id: bc82d9dc-fcba-4a44-bca5-4cae60280aad
status: experimental
description: Detects PowerShell Defender cmdlets attempting to disable selected protections or add antivirus exclusions. Process telemetry does not prove that the change succeeded.
references:
  - https://learn.microsoft.com/en-us/defender-endpoint/configure-contextual-file-folder-exclusions-microsoft-defender-antivirus
  - https://learn.microsoft.com/en-us/defender-endpoint/microsoft-defender-antivirus-exclusions-configure
  - https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
  - https://attack.mitre.org/techniques/T1685/
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  product: windows
  category: process_creation
detection:
  image_powershell:
    FileName:
      - powershell.exe
      - pwsh.exe
  command_set:
    ProcessCommandLine|contains: Set-MpPreference
  command_preference:
    ProcessCommandLine|contains:
      - Set-MpPreference
      - Add-MpPreference
  command_disable_switch:
    ProcessCommandLine|contains:
      - DisableRealtimeMonitoring
      - DisableBehaviorMonitoring
      - DisableScriptScanning
      - DisableIOAVProtection
  command_true:
    ProcessCommandLine|contains:
      - '$true'
      - ' true'
  command_exclusion:
    ProcessCommandLine|contains:
      - ExclusionPath
      - ExclusionProcess
      - ExclusionExtension
  condition: image_powershell and ((command_set and command_disable_switch and command_true) or (command_preference and command_exclusion))
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved endpoint-management scripts, software compatibility exclusions, and temporary support diagnostics.
level: high
