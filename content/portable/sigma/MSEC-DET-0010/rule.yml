title: High-Risk Microsoft Entra User Risk Event Remains Active
id: 4f836bf5-4216-463e-9b47-ec5541df4f86
status: experimental
description: Detects a high-risk Microsoft Entra user risk event that remains at risk or confirmed compromised.
references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/aaduserriskevents
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/queries/aaduserriskevents
  - https://attack.mitre.org/techniques/T1078/004/
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.initial-access
  - attack.t1078.004
logsource:
  product: azure
  service: aaduserriskevents
detection:
  selection:
    RiskLevel: high
    RiskState:
      - atRisk
      - confirmedCompromised
  condition: selection
fields:
  - TimeGenerated
  - UserId
  - UserPrincipalName
  - RiskEventType
  - RiskLevel
  - RiskState
  - OperationName
falsepositives:
  - A high-risk event that investigation subsequently confirms as safe or that remediation has not yet updated.
level: high
