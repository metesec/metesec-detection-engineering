title: NTDSutil installation-media creation command
id: 44580003-613f-4cb3-9d47-c9b1c6fa3b58
status: experimental
description: Detects an NTDSutil command requesting Active Directory installation media through IFM after explicit NTDS instance activation. The process event does not confirm a database copy was produced.
references:
  - https://attack.mitre.org/techniques/T1003/003/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc732530(v=ws.11)
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_ntds.yml
author: MeteSec Detection Engineering
license: Apache-2.0
date: 2026-09-03
modified: 2026-09-11
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName: ntdsutil.exe
  selection_original:
    ProcessVersionInfoOriginalFileName: ntdsutil.exe
  selection_instance:
    ProcessCommandLine|re|i: '(?:^|[\s"])ac(?:tivate)?\s+i(?:nstance)?\s+ntds(?:[\s"]|$)'
  selection_ifm:
    ProcessCommandLine|re|i: '(?:^|[\s"])ifm(?:[\s"]|$)'
  selection_create:
    ProcessCommandLine|re|i: '(?:^|[\s"])create\s+(?:full|rodc|sysvol)(?:[\s"]|$)'
  condition: (selection_image or selection_original) and selection_instance and selection_ifm and selection_create
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - ProcessVersionInfoOriginalFileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved Active Directory domain-controller installation, recovery, or backup preparation using IFM.
level: high
