title: Odbcconf Registers a DLL with REGSVR
id: 1e7ff301-2162-47c6-a7a4-4c1a73546588
status: experimental
description: Detects Odbcconf use of the REGSVR action to register a DLL.
references:
  - https://attack.mitre.org/techniques/T1218/008/
  - https://learn.microsoft.com/en-us/sql/odbc/odbcconf-exe
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_odbcconf_register_dll_regsvr.yml
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.stealth
  - attack.t1218.008
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName: odbcconf.exe
  selection_original:
    ProcessVersionInfoOriginalFileName: odbcconf.exe
  selection_regsvr:
    ProcessCommandLine|contains: 'REGSVR '
  selection_dll:
    ProcessCommandLine|contains: '.dll'
  condition: (selection_image or selection_original) and selection_regsvr and selection_dll
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - ProcessVersionInfoOriginalFileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved ODBC driver installation, registration, or repair packages that use the documented REGSVR action.
level: medium
