title: Owner Added to a Microsoft Entra Application or Service Principal
id: e7aefa03-bf57-44d6-a480-f42077225282
status: experimental
description: Detects a successful Microsoft Entra audit operation that adds an owner to an application registration or service principal.
references:
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
  - https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/auditlogs
  - https://attack.mitre.org/techniques/T1098/003/
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName:
      - Add owner to application
      - Add owner to service principal
    Result: success
  condition: selection
fields:
  - TimeGenerated
  - OperationName
  - Result
  - InitiatedBy
  - TargetResources
  - CorrelationId
  - LoggedByService
falsepositives:
  - Approved application onboarding, ownership transfer, support delegation, and migration performed by authorized administrators.
level: medium
