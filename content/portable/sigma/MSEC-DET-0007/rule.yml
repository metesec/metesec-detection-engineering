title: PowerShell Process Uses an Encoded-Command Flag
id: 998f33ee-0841-4046-be52-d8bf3fbd485a
status: experimental
description: Detects Windows PowerShell or PowerShell Core command lines that use selected encoded-command flags.
references:
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
  - https://attack.mitre.org/techniques/T1059/001/
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName:
      - powershell.exe
      - pwsh.exe
  selection_flag:
    ProcessCommandLine|contains:
      - ' -enc '
      - ' -enc:'
      - ' -encodedcommand '
      - ' -encodedcommand:'
  condition: selection_image and selection_flag
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved software deployment, endpoint management, security tooling, and administrative automation.
level: high
