title: Microsoft Entra Conditional Access Policy Deleted
id: 672b3092-8e8e-468c-8eaf-3369fd2b492c
status: experimental
description: Detects a successful Microsoft Entra audit operation that deletes a Conditional Access policy.
references:
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
  - https://learn.microsoft.com/en-us/entra/architecture/security-operations-infrastructure
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/auditlogs
  - https://attack.mitre.org/techniques/T1556/009/
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.defense-evasion
  - attack.t1556.009
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName: Delete Conditional Access policy
    Result: success
  condition: selection
fields:
  - TimeGenerated
  - OperationName
  - Result
  - InitiatedBy
  - TargetResources
  - CorrelationId
  - LoggedByService
falsepositives:
  - Approved policy retirement, migration, emergency access, and replacement changes performed by authorized identity administrators.
level: medium
