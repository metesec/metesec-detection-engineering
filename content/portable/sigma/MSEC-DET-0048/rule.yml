title: Suspicious Local Scheduled Task Creation
id: 50d2d2e7-0172-4b11-ac36-aeb225560c31
status: experimental
description: Detects local Schtasks task creation whose action contains a selected user-writable payload or behavior-bearing script and proxy-execution command.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    FileName: schtasks.exe
  selection_original:
    ProcessVersionInfoOriginalFileName: schtasks.exe
  selection_create:
    ProcessCommandLine|contains: '/create'
  selection_task_action:
    ProcessCommandLine|contains: '/tr'
  user_location:
    ProcessCommandLine|contains:
      - '\AppData\'
      - '\Users\Public\'
      - '\Windows\Temp\'
      - '\Temp\'
      - '%APPDATA%'
      - '%LOCALAPPDATA%'
      - '%TEMP%'
  payload_marker:
    ProcessCommandLine|contains:
      - '.exe'
      - '.com'
      - '.scr'
      - '.dll'
      - '.ps1'
      - '.vbs'
      - '.vbe'
      - '.js'
      - '.jse'
      - '.wsf'
      - '.hta'
      - '.bat'
      - '.cmd'
  powershell_image:
    ProcessCommandLine|contains:
      - powershell
      - pwsh
  powershell_behavior:
    ProcessCommandLine|contains:
      - ' -enc '
      - ' -enc:'
      - ' -encodedcommand '
      - ' -encodedcommand:'
      - downloadstring
      - downloadfile
      - invoke-webrequest
      - invoke-restmethod
      - invoke-expression
      - 'iex('
      - '|iex'
      - '-windowstyle hidden'
      - '-w hidden'
  lolbin_image:
    ProcessCommandLine|contains:
      - mshta
      - regsvr32
      - rundll32
  lolbin_behavior:
    ProcessCommandLine|contains:
      - 'http://'
      - 'https://'
      - 'javascript:'
      - 'vbscript:'
      - scrobj.dll
      - mshtml
  filter_remote:
    ProcessCommandLine|contains: ' /s '
  condition: (selection_image or selection_original) and selection_create and selection_task_action and not filter_remote and ((user_location and payload_marker) or (powershell_image and powershell_behavior) or (lolbin_image and lolbin_behavior))
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - ProcessVersionInfoOriginalFileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Approved local software deployment, maintenance, or administrative automation that creates a task with one of the selected payload forms.
level: medium
