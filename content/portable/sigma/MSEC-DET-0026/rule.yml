title: Successful Microsoft Entra ROPC sign-in
id: b87688fd-6605-485c-ad56-cce9ae950970
status: experimental
description: Detects a successful Microsoft Entra ROPC sign-in as a legacy-authentication hygiene signal; protocol use alone does not establish credential compromise.
references:
  - https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/signinlogs
  - https://attack.mitre.org/techniques/T1078/004/
author: MeteSec Detection Engineering
license: Apache-2.0
date: 2026-09-03
modified: 2026-09-11
tags:
  - attack.initial-access
  - attack.t1078.004
logsource:
  product: azure
  service: signinlogs
detection:
  selection_success:
    ResultType: '0'
  selection_protocol:
    AuthenticationProtocol: ropc
  condition: selection_success and selection_protocol
fields:
  - TimeGenerated
  - UserPrincipalName
  - IPAddress
  - AppDisplayName
  - AppId
  - AuthenticationProtocol
  - AuthenticationRequirement
  - ConditionalAccessStatus
  - UserId
  - CorrelationId
falsepositives:
  - Approved automated testing or documented legacy applications that still require ROPC.
level: low
