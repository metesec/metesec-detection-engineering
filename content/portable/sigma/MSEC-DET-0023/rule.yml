title: Reg.exe Exports the SAM or SECURITY Registry Hive
id: 28fb405d-95c7-46e2-bf80-4f40b2f7ac59
status: experimental
description: Detects reg.exe save or export commands targeting the SAM or SECURITY registry hive.
references:
  - https://attack.mitre.org/techniques/T1003/002/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/reg-save
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
author: MeteSec Detection Engineering
license: Apache-2.0
date: 2026-09-03
modified: 2026-09-11
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  product: windows
  category: process_creation
detection:
  image:
    FileName: reg.exe
  sensitive_hive_export:
    ProcessCommandLine|re: '(?i)\s(?:save|export)\s+"?(?:HKLM|HKEY_LOCAL_MACHINE)\\(?:SAM|SECURITY)(?:\\[^"\s]*)?"?\s+\S'
  condition: image and sensitive_hive_export
fields:
  - TimeGenerated
  - Timestamp
  - DeviceId
  - DeviceName
  - AccountName
  - InitiatingProcessFileName
  - FileName
  - FolderPath
  - ProcessCommandLine
  - ReportId
falsepositives:
  - Authorized forensic acquisition, incident response, backup, or disaster-recovery activity.
level: high
