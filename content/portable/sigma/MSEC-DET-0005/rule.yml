title: Application Role Granted to a Microsoft Entra Service Principal
id: 8bebff20-714e-4343-b432-e1f8936fa214
status: experimental
description: Detects a successful Microsoft Entra audit event that grants an application role to a service principal.
references:
  - https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/auditlogs
  - https://attack.mitre.org/techniques/T1098/003/
author: MeteSec Detection Engineering
date: 2026-09-03
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName: Add app role assignment to service principal
    Result: success
  condition: selection
fields:
  - TimeGenerated
  - OperationName
  - Result
  - InitiatedBy
  - TargetResources
  - CorrelationId
  - LoggedByService
falsepositives:
  - Approved application onboarding, API permission changes, automation deployment, or identity-lifecycle activity.
level: medium
